<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Screen</title>
<meta name="theme-color" content="#1f8a5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: kid side = big tap targets, channel shelf over a video grid; grown-up side = tabbed settings panel */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --sunk:#e6eeea; --line:#d3ded8;
  --fg:#16262d; --muted:#5b6e74;
  --accent:#1f8a5b; --accent-ink:#ffffff; --sun:#f2b705; --danger:#c2412d; --danger-soft:#fbe6e2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1d; --surface:#172529; --sunk:#1d2e33; --line:#2b3f44;
  --fg:#e7f0ee; --muted:#9db0b2; --accent:#3cbf86; --accent-ink:#06150f; --sun:#f5c63a; --danger:#ff7a63; --danger-soft:#3a201c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1d; --surface:#172529; --sunk:#1d2e33; --line:#2b3f44;
  --fg:#e7f0ee; --muted:#9db0b2; --accent:#3cbf86; --accent-ink:#06150f; --sun:#f5c63a; --danger:#ff7a63; --danger-soft:#3a201c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);min-height:100vh;overflow-x:clip;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto;font-family:var(--display);font-weight:600;font-size:1.25rem;background:none;border:0;cursor:pointer;padding:4px}
.brand svg{width:30px;height:30px}
.search{flex:1;min-width:0;display:flex}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.warn{background:var(--sun);color:#2a2000}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px}
.icon-btn svg{width:22px;height:22px}

main{padding-block:20px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
main > *{min-width:0}

/* channel shelf */
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chip{flex:0 0 auto;width:96px;display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:4px;text-align:center}
.chip .av{width:72px;height:72px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;overflow:hidden;border:3px solid transparent}
.chip.on .av,.chip:hover .av{border-color:var(--accent)}
.chip span{font-size:.85rem;line-height:1.2;max-width:96px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* video grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:grid;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.card:hover .thumb img{transform:scale(1.04)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:.78rem;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.card .t{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c{font-size:.85rem;color:var(--muted)}
.skel{aspect-ratio:16/9;border-radius:var(--r);background:var(--sunk);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.panel > *{min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > input,.row > .grow{flex:1 1 180px;min-width:0}
.row > .btn{flex:0 0 auto}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
input[type=text],input[type=password],input[type=number],textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.empty{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.empty svg{width:88px;height:88px}
.msg{padding:10px 14px;border-radius:10px;background:var(--sunk)}
.msg.bad{background:var(--danger-soft);color:var(--danger)}

/* watch */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.watch{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden}
.stage:fullscreen{border-radius:0}
.stage #yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;z-index:3}
.shield.top{left:0;right:0;top:0;height:64px}
.shield.logo{right:0;bottom:0;width:130px;height:52px}
.cover{position:absolute;inset:0;z-index:4;background:rgba(10,18,20,.86);display:grid;place-items:center;align-content:center;gap:16px;color:#fff;text-align:center;padding:16px}
.cover .big{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;place-items:center}
.cover .big svg{width:40px;height:40px}
.up-list{display:grid;gap:12px}
.up{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.up .t{font-weight:700;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* PIN pad */
.gate{min-height:80vh;display:grid;place-items:center;padding-block:32px}
.gate .panel{width:min(380px,100%);text-align:center;justify-items:center}
.dots{display:flex;gap:12px;justify-content:center;min-height:22px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-size:1.5rem;cursor:pointer}
.pad button:active{background:var(--sunk)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* parent */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{flex:0 0 auto;padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:.75rem;margin-left:4px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.item .av{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);overflow:hidden}
.item .vt{width:96px;flex:0 0 auto;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--sunk)}
.item .vt img{width:100%;height:100%;object-fit:cover}
.item .meta{flex:1;min-width:0}
.item .meta > span{display:block;overflow-wrap:anywhere}
.item > .btn{flex:0 0 auto}
.item .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tagx{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-weight:700}
.tagx button{border:0;background:none;color:inherit;cursor:pointer;width:26px;height:26px;border-radius:50%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;max-width:calc(100% - 32px);font-weight:700}
.sites{margin:0;padding:12px 16px;list-style:none;display:grid;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.sites code{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;user-select:all;overflow-wrap:anywhere}
@media (max-width:560px){
  .grid{grid-template-columns:minmax(0,1fr)}.up{grid-template-columns:130px minmax(0,1fr)}
  .search{order:3;flex-basis:100%}.bar .wrap{flex-wrap:wrap}
  .brand{font-size:1.1rem;gap:6px}.brand svg{width:26px;height:26px}
  .bar .pill{font-size:.75rem;padding:3px 8px}
  .lock-exit{flex:0 0 auto;min-height:36px;padding:6px 14px 6px 11px;gap:6px;border-radius:999px;font-size:.9rem;line-height:1}
  .lock-exit svg{width:16px;height:16px;flex:0 0 auto}
}
@media (max-width:420px){.parent-bar .pill{display:none}}
@media (max-width:560px){.panel{padding:16px}.item{gap:10px;padding:10px}.item .av{width:40px;height:40px}.row > input{flex-basis:100%}.row > .btn{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* ============ storage ============ */
const LS_KEY = "littlescreen.v1";
const DEFAULTS = {
  pin: null,              // {salt, hash}
  apiKey: "",
  whitelist: [],          // {id, handle, title, thumb, uploads}
  blacklist: [],          // {id, handle, title, thumb}
  videos: [],             // individually approved videos
  keywords: [],
  blockShorts: true,
  dailyLimit: 0,          // minutes, 0 = no limit
  usage: { date: "", sec: 0, extra: 0 },
  requests: [],           // {video, ts}
  cache: {},              // channelId -> {ts, items}
  noEmbed: {}             // videoIds whose owners turned off playback outside YouTube
};
let S = load();
function load() {
  try { return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), JSON.parse(localStorage.getItem(LS_KEY) || "{}")); }
  catch (e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { toast("Couldn't save on this device. Storage may be full or blocked."); }
}

/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const thumbOf = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const initial = s => esc((String(s || "?").replace(/^@/, "")[0] || "?").toUpperCase());
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function isoDur(s) { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || ""); if (!m) return null; return ((+m[1] || 0) * 86400) + ((+m[2] || 0) * 3600) + ((+m[3] || 0) * 60) + (+m[4] || 0); }
function fmtDur(sec) { if (!sec) return ""; const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }

const ICON = {
  logo: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="20" rx="6" fill="var(--accent)"/><path d="M13 10.5v9l7.5-4.5z" fill="var(--accent-ink)"/><rect x="10" y="27" width="12" height="2.5" rx="1.25" fill="var(--sun)"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  play: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>`,
  full: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`,
  tv: `<svg viewBox="0 0 88 88" aria-hidden="true"><rect x="10" y="20" width="68" height="46" rx="12" fill="var(--sunk)" stroke="var(--line)" stroke-width="3"/><circle cx="34" cy="42" r="4" fill="var(--muted)"/><circle cx="54" cy="42" r="4" fill="var(--muted)"/><path d="M36 54q8 5 16 0" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 12l10 8 10-8" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`
};

/* ============ link parsing ============ */
function parseInput(s) {
  s = String(s || "").trim(); let m;
  if (!s) return null;
  if ((m = s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/))) return { type: "video", id: m[1] };
  if ((m = s.match(/(UC[\w-]{22})/))) return { type: "channel", id: m[1] };
  if ((m = s.match(/@([\w.\-]{3,})/))) return { type: "handle", handle: "@" + m[1].toLowerCase() };
  if (/^[\w-]{11}$/.test(s)) return { type: "video", id: s };
  if (/^[\w.\-]{3,30}$/.test(s)) return { type: "handle", handle: "@" + s.toLowerCase() };
  return null;
}

/* ============ YouTube data ============ */
async function yt(path, params) {
  if (!S.apiKey) throw new Error("NOKEY");
  const u = new URL("https://www.googleapis.com/youtube/v3/" + path);
  for (const k in params) u.searchParams.set(k, params[k]);
  u.searchParams.set("key", S.apiKey);
  const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || "YouTube returned error " + r.status);
  return j;
}
function toVideo(v) {
  return {
    id: v.id, title: v.snippet.title, desc: (v.snippet.description || "").slice(0, 400),
    tags: (v.snippet.tags || []).slice(0, 25), channelId: v.snippet.channelId, channelHandle: "",
    channelTitle: v.snippet.channelTitle, dur: isoDur(v.contentDetails?.duration), pub: v.snippet.publishedAt,
    live: v.snippet.liveBroadcastContent || "none", embeddable: v.status?.embeddable !== false
  };
}
async function resolveChannel(p) {
  if (!S.apiKey) {
    if (p.type === "channel") return { id: p.id, handle: "", title: p.id, thumb: "" };
    return { id: "", handle: p.handle, title: p.handle, thumb: "" };
  }
  const params = { part: "snippet,contentDetails" };
  if (p.type === "channel") params.id = p.id; else params.forHandle = p.handle;
  const j = await yt("channels", params);
  const c = j.items?.[0];
  if (!c) throw new Error("We couldn't find that channel. Check the link or @handle.");
  return {
    id: c.id, handle: (c.snippet.customUrl || "").toLowerCase(), title: c.snippet.title,
    thumb: c.snippet.thumbnails?.medium?.url || c.snippet.thumbnails?.default?.url || "",
    uploads: c.contentDetails?.relatedPlaylists?.uploads || "UU" + c.id.slice(2)
  };
}
async function videoMeta(id) {
  if (S.apiKey) {
    const j = await yt("videos", { part: "snippet,contentDetails,status", id });
    if (!j.items?.[0]) throw new Error("That video isn't available.");
    return toVideo(j.items[0]);
  }
  // No key: oEmbed via noembed (CORS-enabled). Gives title + channel URL, no duration.
  const r = await fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id));
  const j = await r.json();
  if (j.error) throw new Error("That video isn't available.");
  const url = j.author_url || "";
  const h = url.match(/@[\w.\-]+/), c = url.match(/UC[\w-]{22}/);
  return { id, title: j.title, desc: "", tags: [], channelId: c ? c[0] : "", channelHandle: h ? h[0].toLowerCase() : "", channelTitle: j.author_name, dur: null, pub: "", live: "none" };
}
async function channelFeed(ch, force) {
  if (!S.apiKey || !ch.id) return [];
  const c = S.cache[ch.id];
  if (!force && c && Date.now() - c.ts < 6 * 3600e3) return c.items;
  const pl = await yt("playlistItems", { part: "contentDetails", playlistId: ch.uploads || "UU" + ch.id.slice(2), maxResults: 40 });
  const ids = (pl.items || []).map(i => i.contentDetails.videoId).join(",");
  let items = [];
  if (ids) items = ((await yt("videos", { part: "snippet,contentDetails,status", id: ids })).items || []).map(toVideo);
  items.forEach(v => v.channelHandle = ch.handle || "");
  S.cache[ch.id] = { ts: Date.now(), items }; save();
  return items;
}

/* ============ the rules ============ */
const keysOf = v => [v.channelId, v.channelHandle].filter(Boolean).map(x => x.toLowerCase());
function inList(list, v) {
  const ks = keysOf(v);
  return list.some(c => (c.id && ks.includes(c.id.toLowerCase())) || (c.handle && ks.includes(c.handle.toLowerCase())));
}
const isShort = v => /#shorts?\b/i.test((v.title || "") + " " + (v.desc || "")) || (v.dur != null && v.dur > 0 && v.dur <= 60);
function verdict(v) {
  if (v.embeddable === false || S.noEmbed[v.id]) return { ok: false, why: "This video's channel only lets it play on YouTube itself." };
  if (inList(S.blacklist, v)) return { ok: false, why: "This channel is blocked." };
  if (S.videos.some(x => x.id === v.id)) return { ok: true };           // a grown-up approved this exact video
  const hay = ((v.title || "") + " " + (v.desc || "") + " " + (v.tags || []).join(" ")).toLowerCase();
  if (S.keywords.some(k => hay.includes(k.toLowerCase()))) return { ok: false, why: "This video has a word your grown-up blocked." };
  if (S.blockShorts && isShort(v)) return { ok: false, why: "Shorts are turned off." };
  if (v.live === "live" || v.live === "upcoming") return { ok: false, why: "Live streams aren't on your list." };
  if (inList(S.whitelist, v)) return { ok: true };
  return { ok: false, why: "This channel isn't on your list yet." };
}

/* ============ PIN ============ */
async function hashPin(pin, salt) {
  if (window.crypto?.subtle) {
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 2166136261; for (const ch of salt + ":" + pin) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return "f" + (h >>> 0).toString(16);
}
async function setPin(pin) {

    body = `<div class="panel"><h2>Watch rules</h2>
      <label class="switch"><span><b>Block Shorts</b><br><span class="muted small">Hides videos tagged #shorts and anything one minute or shorter.</span></span><input type="checkbox" id="shortsT" ${S.blockShorts ? "checked" : ""}></label>
      <div class="field"><label for="limitIn">Daily watch time (minutes, 0 for no limit)</label><div class="row"><input id="limitIn" type="number" min="0" max="600" step="5" value="${S.dailyLimit}" style="max-width:140px"><span class="muted small">Watched today: ${Math.floor(u.sec / 60)} min${u.extra ? ` · ${u.extra} min added` : ""}</span></div></div>
      ${S.dailyLimit ? `<div class="row"><button class="btn sm" data-extra="15">+15 min today</button><button class="btn sm" data-extra="30">+30 min today</button></div>` : ""}
    </div>
    <div class="panel"><h2>YouTube API key</h2>
      <p class="muted small" style="margin:0">Lets Little Screen list each allowed channel's videos and read video lengths. Get a free key from the Google Cloud Console (enable “YouTube Data API v3”). Restrict it to your site's address.</p>
      <form id="keyForm" class="row"><input id="keyIn" type="password" autocomplete="off" placeholder="AIza…" value="${esc(S.apiKey)}" aria-label="API key"><button class="btn primary">Save key</button></form>
      <div class="row"><button class="btn sm" id="refreshBtn" ${S.apiKey ? "" : "disabled"}>Reload channel videos now</button></div>
    </div>
    <div class="panel"><h2>Sites to allow on this device</h2>
      <p class="muted small" style="margin:0">Add these to the allowed websites in Screen Time, Family Link or your router, so the player works while the rest of the web stays blocked.</p>
      <ul class="sites">${SITES().map(s => `<li><code>${esc(s)}</code></li>`).join("")}</ul>
      <div><button class="btn sm" id="copySites">Copy list</button></div>
    </div>
    <div class="panel"><h2>PIN</h2>
      <form id="pinForm" class="row"><input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4–6 numbers)" aria-label="New PIN"><button class="btn">Change PIN</button></form>
    </div>
    <div class="panel"><h2>Back up or move settings</h2>
      <p class="muted small" style="margin:0">Copy your lists to another device. The PIN and API key are not included.</p>
      <div class="row"><button class="btn sm" id="expBtn">Show backup</button><button class="btn sm" id="dlBtn">Download backup</button><label class="btn sm" for="impFile">Load backup file</label><input id="impFile" type="file" accept="application/json" hidden></div>
      <textarea id="expTxt" hidden readonly aria-label="Backup data"></textarea>
    </div>
    <div class="panel"><h2>Start over</h2><p class="muted small" style="margin:0">Erases the PIN, lists, requests and key on this device.</p><div><button class="btn danger" id="resetBtn">Erase everything</button></div></div>`;
  }
  return `<header class="bar parent-bar"><div class="wrap" style="flex-wrap:nowrap">
      <button class="brand" data-go="home">${ICON.logo}<span>Little Screen</span></button><span class="pill">Grown-up mode</span><div style="flex:1"></div>
      <button class="btn sm primary lock-exit" data-go="home">${ICON.lock}<span>Lock</span></button></div></header>
    <main class="wrap">
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-tab="${k}">${l}${k === "requests" && S.requests.length ? `<span class="badge">${S.requests.length}</span>` : ""}</button>`).join("")}</div>
      ${body}
    </main>`;
}
function rerenderParent(tab) { V.tab = tab ?? V.tab; render(); }
const looksLikeSite = s => /^(https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|org|net|io|co|tv|app|dev|be|th|mm)(\/.*)?$/i.test(String(s).trim()) && !/youtu(\.be|be\.com)\/.+/i.test(s);
async function addChannel(raw, listName, msgEl) {
  if (looksLikeSite(raw)) { msgEl.innerHTML = `<div class="msg bad">That's a website address, not a YouTube channel. Website addresses go in your device's allowed sites (see <b>Settings → Sites to allow</b>). Here, paste a channel's @handle or a video link.</div>`; return; }
  const p = parseInput(raw);
  if (!p) { msgEl.innerHTML = `<div class="msg bad">Paste a channel link, an @handle, or a video link from that channel.</div>`; return; }
  msgEl.innerHTML = `<p class="muted">Looking it up…</p>`;
  try {
    let ch;
    if (p.type === "video") { const v = await videoMeta(p.id); ch = v.channelId ? await resolveChannel({ type: "channel", id: v.channelId }) : await resolveChannel({ type: "handle", handle: v.channelHandle }); if (!S.apiKey) ch.title = v.channelTitle; }
    else ch = await resolveChannel(p);
    const other = listName === "whitelist" ? "blacklist" : "whitelist";
    const same = c => (ch.id && c.id === ch.id) || (ch.handle && c.handle === ch.handle);
    if (S[listName].some(same)) { msgEl.innerHTML = `<div class="msg">${esc(ch.title)} is already on this list.</div>`; return; }
    S[other] = S[other].filter(c => !same(c));
    S[listName].push(ch); save();
    rerenderParent(); toast(`${listName === "whitelist" ? "Allowed" : "Blocked"}: ${ch.title}`);
  } catch (err) { msgEl.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
}
function backupJSON() { const { pin, apiKey, cache, usage, ...rest } = S; return JSON.stringify({ app: "littlescreen", v: 1, ...rest }, null, 2); }
after.parent = () => {
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => rerenderParent(b.dataset.tab)));
  $("#chForm")?.addEventListener("submit", e => { e.preventDefault(); addChannel($("#chIn").value, V.tab === "allow" ? "whitelist" : "blacklist", $("#chMsg")); });
  document.querySelectorAll("[data-sugg]").forEach(b => b.addEventListener("click", () => addChannel(b.dataset.sugg, "whitelist", $("#chMsg"))));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { const l = b.dataset.del, k = b.dataset.key; S[l] = S[l].filter(c => (c.id || c.handle) !== k); save(); rerenderParent(); }));
  $("#vForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const p = parseInput($("#vIn").value), m = $("#vMsg");
    if (!p || p.type !== "video") { m.innerHTML = `<div class="msg bad">Paste a link to a single video.</div>`; return; }
    m.innerHTML = `<p class="muted">Looking it up…</p>`;
    try { const v = await videoMeta(p.id); if (!S.videos.some(x => x.id === v.id)) S.videos.unshift(v); save(); rerenderParent(); toast("Approved: " + v.title); }
    catch (err) { m.innerHTML = `<div class="msg bad">${esc(err.message === "NOKEY" ? "Couldn't look that up." : err.message)}</div>`; }
  });
  document.querySelectorAll("[data-delv]").forEach(b => b.addEventListener("click", () => { S.videos = S.videos.filter(v => v.id !== b.dataset.delv); save(); rerenderParent(); }));
  $("#kwForm")?.addEventListener("submit", e => { e.preventDefault(); const w = $("#kwIn").value.split(",").map(s => s.trim()).filter(Boolean); S.keywords = [...new Set([...S.keywords, ...w])]; save(); rerenderParent(); });
  document.querySelectorAll("[data-delk]").forEach(b => b.addEventListener("click", () => { S.keywords.splice(+b.dataset.delk, 1); save(); rerenderParent(); }));
  document.querySelectorAll("[data-req]").forEach(b => b.addEventListener("click", async () => {
    const r = S.requests[+b.dataset.i], v = r.video, act = b.dataset.req;
    const drop = () => { S.requests = S.requests.filter(x => x !== r); };
    if (act === "video") { if (!S.videos.some(x => x.id === v.id)) S.videos.unshift(v); drop(); save(); rerenderParent(); toast("Approved"); return; }
    if (act === "no") { drop(); save(); rerenderParent(); return; }
    const holder = document.createElement("div"); b.closest(".item").after(holder);
    const listName = act === "channel" ? "whitelist" : "blacklist";
    const raw = v.channelId || v.channelHandle;
    if (!raw) { holder.innerHTML = `<div class="msg bad">This video doesn't say which channel it's from. Approve the video instead.</div>`; return; }
    drop(); save(); await addChannel(raw, listName, holder);
  }));
  $("#shortsT")?.addEventListener("change", e => { S.blockShorts = e.target.checked; save(); toast(S.blockShorts ? "Shorts blocked" : "Shorts allowed"); });
  $("#limitIn")?.addEventListener("change", e => { S.dailyLimit = Math.max(0, Math.min(600, parseInt(e.target.value, 10) || 0)); save(); rerenderParent(); toast(S.dailyLimit ? `Daily limit: ${S.dailyLimit} min` : "No daily limit"); });
  document.querySelectorAll("[data-extra]").forEach(b => b.addEventListener("click", () => { usage().extra += +b.dataset.extra; save(); rerenderParent(); toast(`Added ${b.dataset.extra} minutes for today`); }));
  $("#keyForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const k = $("#keyIn").value.trim(); const old = S.apiKey; S.apiKey = k;
    if (!k) { save(); rerenderParent(); toast("API key removed"); return; }
    try { await yt("videos", { part: "id", id: "aqz-KE-bpKQ" }); S.cache = {}; save(); rerenderParent(); toast("Key works. Saved."); }
    catch (err) { S.apiKey = old; toast("That key didn't work: " + err.message); }
  });
  $("#refreshBtn")?.addEventListener("click", async () => { toast("Reloading channel videos…"); await refreshFeeds(true); toast(feedState.err || "Channel videos updated"); });
  $("#pinForm")?.addEventListener("submit", async e => { e.preventDefault(); const p = $("#newPin").value; if (!/^\d{4,6}$/.test(p)) return toast("A PIN is 4 to 6 numbers."); await setPin(p); $("#newPin").value = ""; toast("PIN changed"); });
  $("#copySites")?.addEventListener("click", () => {
    const txt = SITES().join("\n");
    navigator.clipboard?.writeText(txt).then(() => toast("Site list copied"), () => toast("Couldn't copy. Select the list and copy it by hand."));
  });
  $("#expBtn")?.addEventListener("click", () => { const t = $("#expTxt"); t.value = backupJSON(); t.hidden = false; t.select(); });
  $("#dlBtn")?.addEventListener("click", () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupJSON()], { type: "application/json" })); a.download = `little-screen-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
  $("#impFile")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== "littlescreen") throw new Error("not a Little Screen backup");
      for (const k of ["whitelist", "blacklist", "videos", "keywords", "requests"]) if (Array.isArray(d[k])) S[k] = d[k];
      if (typeof d.blockShorts === "boolean") S.blockShorts = d.blockShorts;
      if (Number.isFinite(d.dailyLimit)) S.dailyLimit = d.dailyLimit;
      S.cache = {}; save(); rerenderParent(); toast("Backup loaded");
    } catch (err) { toast("Couldn't load that file: " + err.message); }
  });
  let armed = 0;
  $("#resetBtn")?.addEventListener("click", e => {
    if (Date.now() - armed > 4000) { armed = Date.now(); e.target.textContent = "Tap again to erase everything"; setTimeout(() => { if ($("#resetBtn")) $("#resetBtn").textContent = "Erase everything"; }, 4000); return; }
    try { localStorage.removeItem(LS_KEY); } catch (err) {}
    S = load(); V = { name: "home" }; render();
  });
};

/* ============ global clicks + auto-lock ============ */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"), w = e.target.closest("[data-watch]"), c = e.target.closest("[data-ch]");
  if (g) { const n = g.dataset.go; if (n === "home" && V.name === "parent") toast("Locked"); return go({ name: n }); }
  if (w) return go({ name: "watch", id: w.dataset.watch });
  if (c) return go({ name: "channel", ch: c.dataset.ch });
});
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { if (V.name === "parent") parentSeen = Date.now(); }, true));
setInterval(() => { if (V.name === "parent" && Date.now() - parentSeen > 3 * 60e3) { go({ name: "home" }); toast("Settings locked after 3 minutes idle"); } }, 5000);
document.addEventListener("visibilitychange", () => { if (document.hidden && V.name === "parent") go({ name: "home" }); });

// one-time cleanup: remove website addresses that were saved as channels by mistake
(() => {
  const isSite = c => !c.id && /\.(com|org|net|io|co|tv|app|dev|be|th|mm)$/i.test((c.handle || "").replace(/^@/, ""));
  const before = S.whitelist.length + S.blacklist.length;
  S.whitelist = S.whitelist.filter(c => !isSite(c)); S.blacklist = S.blacklist.filter(c => !isSite(c));
  if (S.whitelist.length + S.blacklist.length !== before) save();
  // older saved video lists don't record which videos can play outside YouTube; reload them once
  if (Object.values(S.cache).some(c => (c.items || []).some(v => !("embeddable" in v)))) { S.cache = {}; save(); }
})();

// first-run setup wiring
const _render = render;
render = function () { _render(); if (!S.pin) wirePin("setup"); };
render();
</script>
</body>
</html>
